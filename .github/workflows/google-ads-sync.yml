# .github/workflows/google-ads-sync.yml
name: Google Ads Performance Sync

on:
  schedule:
    # 9:00 AM Pakistan Time (PKT) = 4:00 AM UTC
    - cron: '0 4 * * *'
    # 6:00 PM Pakistan Time (PKT) = 1:00 PM UTC (13:00)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  sync-google-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Google Ads Sync
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_IDS: ${{ secrets.GOOGLE_ADS_CUSTOMER_IDS }}
          BIGQUERY_DATASET: 'ads_data_staging'
          BIGQUERY_TABLE: 'clean_ads_transparency'
        run: python google_ads_sync.py
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-sync-logs
          path: logs/
          retention-days: 7
